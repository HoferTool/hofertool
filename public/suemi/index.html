<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SÜMI Schreinerei · Bestellungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --grund:#121316; --flaeche:#1b1d21; --flaeche2:#22252a; --rand:#30343a;
  --text:#f2f3f5; --leise:#9aa0a8; --pink:#e5175f; --pink-dunkel:#5a1027;
  --orange:#f08a1c; --gruen:#2fae5b; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--grund);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Kopf */
.kopf{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rand);position:sticky;top:0;background:var(--grund);z-index:5;padding-top:calc(14px + env(safe-area-inset-top))}
.marke{display:flex;align-items:center;gap:10px}
.marke .wort{line-height:1}
.marke .wort b{display:block;font-size:19px;letter-spacing:.32em;font-weight:500}
.marke .wort small{display:block;font-size:7.5px;letter-spacing:.38em;color:var(--leise);margin-top:3px}
.titelzeile{display:flex;align-items:center;gap:14px;padding:20px 18px 6px}
.titelzeile h1{font-size:22px;font-weight:600;flex:1}
.zurueck{padding:4px;margin-left:-4px}
.inhalt{flex:1;padding:12px 18px 110px}

/* Start */
.start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;
  background:radial-gradient(ellipse at 70% 110%,#3a2a1e 0%,transparent 55%),linear-gradient(160deg,#16171a 0%,#121316 55%,#1d1712 100%)}
.start .gross b{display:block;font-size:56px;font-weight:500;letter-spacing:.34em;margin:28px 0 8px -0.34em;padding-left:.34em}
.start .gross small{font-size:16px;letter-spacing:.42em;color:#ddd}
.start p{margin-top:56px;font-size:20px;line-height:1.4;color:#ddd}
.start .strich{width:60px;height:3px;background:var(--pink);margin:28px auto 56px;border-radius:2px}
.knopf{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--pink);color:#fff;border-radius:10px;padding:14px;font-weight:600;font-size:16px}
.knopf:active{filter:brightness(.9)}
.knopf.klein{width:auto;padding:9px 14px;font-size:14px}
.knopf.grau{background:var(--flaeche2);border:1px solid var(--rand)}

/* Suche und Filter */
.suche{display:flex;align-items:center;gap:10px;border:1px solid var(--rand);border-radius:10px;padding:10px 12px;background:var(--flaeche);margin:12px 0}
.suche input{flex:1;background:none;border:0;outline:0;font-size:14px}
.suche svg{color:var(--leise)}
.filter{display:grid;grid-template-columns:auto 1fr 1.4fr 1fr;gap:8px;margin-bottom:14px}
.filter button{border:1px solid var(--rand);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:500;background:var(--flaeche)}
.filter button.an{background:var(--pink);border-color:var(--pink)}

/* Karten */
.karte{display:flex;gap:14px;align-items:center;background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:12px;margin-bottom:10px;width:100%;text-align:left}
.karte .bild{width:68px;height:68px;border-radius:8px;flex:none;overflow:hidden;background:var(--flaeche2);display:flex;align-items:center;justify-content:center;color:var(--leise)}
.karte .bild img{width:100%;height:100%;object-fit:cover}
.karte .mitte{flex:1;min-width:0}
.karte h3{font-size:15px;font-weight:600;margin-bottom:3px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.karte h3 span{overflow:hidden;text-overflow:ellipsis}
.karte .zeile{font-size:12.5px;color:var(--leise);line-height:1.45}
.karte .zeile b{color:var(--text);font-weight:500}
.karte > svg{color:var(--leise)}
.schild{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap;flex:none}
.schild.offen{background:var(--pink)}
.schild.bearbeitung{background:var(--orange);color:#2a1500}
.schild.erledigt{background:var(--gruen)}
.leer{color:var(--leise);text-align:center;padding:40px 10px}

/* Formular */
.feld{display:flex;gap:14px;align-items:center;background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;position:relative}
.feld:focus-within{border-color:var(--pink)}
.feld > svg{color:var(--text)}
.feld .fi{flex:1;min-width:0}
.feld label{display:block;font-size:13px;font-weight:500;margin-bottom:3px}
.feld input,.feld textarea{width:100%;background:none;border:0;outline:0;font-size:13.5px;color:var(--text)}
.feld input::placeholder,.feld textarea::placeholder{color:var(--leise)}
.feld textarea{resize:none;min-height:20px}
.feld.fehler{border-color:var(--pink)}
.feld.wahl{cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.feld.wahl .wert{font-size:14px;color:var(--text)}
.feld.wahl .wert.leer2{color:var(--leise)}
.ablage{border:1.5px dashed #555b63;border-radius:10px;padding:18px;text-align:center;font-size:13px;color:#ddd;margin-top:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.ablage.drueber{border-color:var(--pink);background:#2a1620}
.vorschau{position:relative;margin-top:10px}
.vorschau img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;display:block}
.vorschau button{position:absolute;top:8px;right:8px;background:#000a;border-radius:20px;padding:6px 10px;font-size:12px}
.feld.block{display:block}
.feld.block .kopfzeile{display:flex;gap:14px;align-items:center}

/* Auswahl-Blatt */
.huelle{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:ein .15s}
.blatt{background:var(--flaeche);border-top-left-radius:18px;border-top-right-radius:18px;width:100%;max-width:560px;max-height:80vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.blatt h2{font-size:17px;font-weight:600;margin-bottom:12px}
.radio{display:flex;gap:14px;align-items:center;padding:11px 6px;width:100%;text-align:left;font-size:14.5px;border-bottom:1px solid var(--rand)}
.radio:last-child{border-bottom:0}
.radio .kreis{width:20px;height:20px;border-radius:50%;border:1.8px solid #cfd3d8;flex:none;display:flex;align-items:center;justify-content:center}
.radio.an .kreis{border-color:var(--pink)}
.radio.an .kreis::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pink)}
.gruppe-titel{font-size:15px;font-weight:600;margin:18px 0 10px}
.liste-kasten{background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:4px 12px}
@keyframes ein{from{opacity:0}}

/* Details */
.detail{background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:14px}
.detail .oben{display:flex;gap:16px}
.detail .oben .bild{width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--flaeche2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--leise)}
.detail .oben img{width:100%;height:100%;object-fit:cover}
.detail h2{font-size:18px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}
.detail dt{font-size:13px;color:var(--leise);margin-top:10px}
.detail dd{font-size:14px;margin-top:2px;white-space:pre-wrap}
.detail .foto{margin-top:14px}
.detail .foto img{width:100%;max-height:260px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.detail .info{display:flex;gap:14px;align-items:center;border-top:1px solid var(--rand);margin-top:14px;padding-top:14px}
.detail .info + .info{border-top:0;margin-top:0}
.detail .info small{display:block;font-size:12px;color:var(--leise)}
.status-wahl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.status-wahl button{border:1px solid var(--rand);border-radius:8px;padding:9px 4px;font-size:13px;background:var(--flaeche)}
.status-wahl button.an.offen{background:var(--pink);border-color:var(--pink)}
.status-wahl button.an.bearbeitung{background:var(--orange);border-color:var(--orange);color:#2a1500}
.status-wahl button.an.erledigt{background:var(--gruen);border-color:var(--gruen)}
.zweiknopf{display:flex;gap:10px;margin-top:10px}

/* Menü */
.menue{position:fixed;inset:0;background:var(--grund);z-index:40;display:flex;flex-direction:column;animation:ein .15s;max-width:560px;margin:0 auto}
.menue .marke-gross{display:flex;justify-content:space-between;align-items:center;padding:36px 22px 26px;padding-top:calc(36px + env(safe-area-inset-top))}
.menue nav{padding:0 14px}
.menue nav button{display:flex;align-items:center;gap:16px;width:100%;padding:14px 12px;border-radius:10px;font-size:15.5px;font-weight:500;margin-bottom:4px}
.menue nav button span{flex:1;text-align:left}
.menue nav button.an{background:var(--pink-dunkel);color:var(--pink);border:1px solid #7d1a3a}
.menue hr{border:0;border-top:1px solid var(--rand);margin:12px 4px}

/* Unten */
.unten{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--flaeche);border-top:1px solid var(--rand);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
.unten button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#ddd}
.unten button.an{color:var(--pink)}

/* Verwalten */
.zeile-verw{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--rand)}
.zeile-verw:last-child{border-bottom:0}
.zeile-verw span{flex:1}
.zeile-verw small{color:var(--leise);font-size:12px}
.zeile-verw button{color:var(--leise);padding:4px}
.neu-zeile{display:flex;gap:8px;margin-top:12px}
.neu-zeile input{flex:1;background:var(--flaeche);border:1px solid var(--rand);border-radius:10px;padding:11px 12px;outline:0}
.neu-zeile input:focus{border-color:var(--pink)}
.text-leise{color:var(--leise);font-size:13px;line-height:1.5}

.meldung{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2e34;border:1px solid var(--rand);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;animation:ein .2s;max-width:90%}
.gross-bild{position:fixed;inset:0;background:#000e;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.gross-bild img{max-width:100%;max-height:100%;border-radius:8px}
.profil-bild{width:72px;height:72px;border-radius:50%;background:var(--pink-dunkel);color:var(--pink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;margin:10px auto}
</style></head><body><div id="app"></div><script>
// ---------- Symbole ----------
const I = {
  paket:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  raute:'<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>',
  datei:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  kamera:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  leute:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/>',
  runter:'<path d="m6 9 6 6 6-6"/>',
  rechts:'<path d="m9 6 6 6-6 6"/>',
  links:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  senden:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
  suche:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  haus:'<path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  menue:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  zahnrad:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  abmelden:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h8M10 12h11M17 8l4 4-4 4"/>',
  stift:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m14 6 4 4"/>',
  uhr:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  muell:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
};
const sym = (n, gr) => `<svg class="i" viewBox="0 0 24 24" ${gr ? `style="width:${gr}px;height:${gr}px"` : ""}>${I[n]}</svg>`;

// Logo: Kreis mit geschwungenen Streifen (eigene Zeichnung nach der Vorlage)
function logo(gr) {
  const id = "c" + Math.random().toString(36).slice(2, 7);
  let streifen = "";
  for (let k = 0; k < 7; k++) {
    const y = 14 + k * 12;
    streifen += `<path d="M-5 ${y} C 20 ${y - 10}, 35 ${y + 12}, 55 ${y + 2} S 90 ${y - 12}, 105 ${y - 4}" stroke="#e5175f" stroke-width="7.5" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg width="${gr}" height="${gr}" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="${id}"><circle cx="50" cy="50" r="48"/></clipPath></defs><g clip-path="url(#${id})">${streifen}</g></svg>`;
}
const marke = (gr = 38) => `<div class="marke">${logo(gr)}<div class="wort"><b>SÜMI</b><small>SCHREINEREI</small></div></div>`;

// ---------- SÜMI Schreinerei: Bestellungen (nach den Bildern) ----------
// Alles in dieser einen Datei. Daten bleiben vorerst auf dem Gerät (localStorage).
const SPEICHER = "suemi.app.v3";
const STATUS = { offen: "Offen", bearbeitung: "In Bearbeitung", erledigt: "Erledigt" };

const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const neueId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const jetzt = () => new Date().toISOString();
function datumZeit(iso) {
  const d = new Date(iso); const z = (n) => String(n).padStart(2, "0");
  return `${z(d.getDate())}.${z(d.getMonth() + 1)}.${d.getFullYear()}, ${z(d.getHours())}:${z(d.getMinutes())}`;
}

function vorgabe() {
  const leute = ["Tobias Mathys", "Ian Staubitzer", "Daniel Stalder", "Hansruedi Sommer", "Levin Neuenschwander"];
  const kom = ["Montage", "Werkstatt", "Oberflächen", "Produktion"];
  const b = (artikel, menge, material, kommission, person, status, minuten) => ({
    id: neueId(), artikel, menge, material, kommission, person, status, bild: "",
    erstellt: new Date(Date.now() - minuten * 60000).toISOString(),
  });
  return {
    leute, kom, ich: "",
    bestellungen: [
      b("Schrauben", "50 Stk.", "Holzbauschrauben 5x80 mm", "Montage", "Tobias Mathys", "offen", 30),
      b("Holzplatte", "4 Stk.", "Dreischichtplatte Fichte 27 mm, 2500 x 1250", "Werkstatt", "Daniel Stalder", "bearbeitung", 120),
      b("Farbe", "3 Dosen", "Lack weiss seidenmatt, je 2.5 l", "Oberflächen", "Ian Staubitzer", "offen", 300),
      b("Bohrerset", "1 Set", "Holzspiralbohrer 3–12 mm", "Montage", "Hansruedi Sommer", "erledigt", 1500),
      b("Spannwerkzeug", "2 Stk.", "Schraubzwingen 300 mm", "Produktion", "Levin Neuenschwander", "offen", 2900),
    ],
  };
}

let D;
try { D = JSON.parse(localStorage.getItem(SPEICHER)) || vorgabe(); } catch { D = vorgabe(); }
function speichern() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(D)); }
  catch { meldung("Speicher voll. Bitte ein kleineres Bild nehmen oder alte Bestellungen löschen."); }
}

// Zustand der Ansicht
const S = { ansicht: "start", filter: "alle", suche: "", id: null, form: null, wahl: null, zurueck: [] };
const app = document.getElementById("app");

function gehe(ansicht, mehr = {}) {
  S.zurueck.push({ ansicht: S.ansicht, id: S.id });
  Object.assign(S, { ansicht }, mehr);
  zeichne(); window.scrollTo(0, 0);
}
function zurueck() {
  const v = S.zurueck.pop() || { ansicht: "liste" };
  S.ansicht = v.ansicht; S.id = v.id; zeichne(); window.scrollTo(0, 0);
}

function meldung(t) {
  document.querySelectorAll(".meldung").forEach((m) => m.remove());
  const m = document.createElement("div"); m.className = "meldung"; m.textContent = t;
  document.body.append(m); setTimeout(() => m.remove(), 2600);
}

// ---------- Bausteine ----------
const kopf = () => `<header class="kopf">${marke()}<button data-a="menue" aria-label="Menü">${sym("menue", 26)}</button></header>`;
const titel = (t, mitZurueck = true, rechts = "") =>
  `<div class="titelzeile">${mitZurueck ? `<button class="zurueck" data-a="zurueck" aria-label="Zurück">${sym("links", 24)}</button>` : ""}<h1>${esc(t)}</h1>${rechts}</div>`;
const schild = (st) => `<span class="schild ${st}">${STATUS[st]}</span>`;
const bildKlein = (b, gr) => b.bild ? `<img src="${b.bild}" alt="">` : sym("paket", gr || 26);
const unten = (an) => `<nav class="unten">
  <button data-a="liste" class="${an === "liste" ? "an" : ""}">${sym("haus", 22)}Übersicht</button>
  <button data-a="neu" class="${an === "neu" ? "an" : ""}">${sym("plus", 22)}Neue Bestellung</button>
  <button data-a="profil" class="${an === "profil" ? "an" : ""}">${sym("person", 22)}Profil</button></nav>`;

// ---------- Ansichten ----------
function vStart() {
  return `<div class="start">${logo(150)}
    <div class="gross"><b>SÜMI</b><small>SCHREINEREI</small></div>
    <p>Gemeinsam<br>mehr möglich machen.</p><div class="strich"></div>
    <button class="knopf" data-a="liste">Zur Bestellung</button></div>`;
}

function passt(b) {
  if (S.filter !== "alle" && b.status !== S.filter) return false;
  const w = S.suche.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const text = [b.artikel, b.kommission, b.person, b.material, b.menge].join(" ").toLowerCase();
  return w.every((x) => text.includes(x));
}

function vListe() {
  const liste = D.bestellungen.filter(passt).sort((a, b) => b.erstellt.localeCompare(a.erstellt));
  const f = (k, t) => `<button data-a="filter" data-w="${k}" class="${S.filter === k ? "an" : ""}">${t}</button>`;
  return `${kopf()}${titel("Bestellungen", false, `<button class="knopf klein" data-a="neu">${sym("plus", 18)}Neue Bestellung</button>`)}
  <main class="inhalt">
    <label class="suche">${sym("suche", 20)}<input id="suche" type="search" placeholder="Nach Artikel, Kommission oder Person suchen …" value="${esc(S.suche)}"></label>
    <div class="filter">${f("alle", "Alle")}${f("offen", "Offen")}${f("bearbeitung", "In Bearbeitung")}${f("erledigt", "Erledigt")}</div>
    <div id="karten">${karten(liste)}</div>
  </main>${unten("liste")}`;
}
function karten(liste) {
  if (!liste.length) return `<div class="leer">Keine Bestellungen gefunden.</div>`;
  return liste.map((b) => `<button class="karte" data-a="detail" data-id="${b.id}">
    <div class="bild">${bildKlein(b)}</div>
    <div class="mitte"><h3><span>${esc(b.artikel)}</span>${schild(b.status)}</h3>
      <div class="zeile">Kommission: ${esc(b.kommission)}</div>
      <div class="zeile">Muss bestellt werden von:</div>
      <div class="zeile"><b>${esc(b.person)}</b></div></div>
    ${sym("rechts", 20)}</button>`).join("");
}

function vDetail() {
  const b = D.bestellungen.find((x) => x.id === S.id);
  if (!b) { S.ansicht = "liste"; return vListe(); }
  const sw = (k) => `<button data-a="status" data-w="${k}" class="${k} ${b.status === k ? "an" : ""}">${STATUS[k]}</button>`;
  return `<div class="kopf">${titel("Bestelldetails").replace('class="titelzeile"', 'class="titelzeile" style="padding:0"')}${logo(34)}</div>
  <main class="inhalt">
    <div class="detail">
      <div class="oben"><div class="bild">${bildKlein(b, 34)}</div>
        <div style="flex:1;min-width:0"><h2><span>${esc(b.artikel)}</span>${schild(b.status)}</h2>
          <dl><dt>Kommission</dt><dd>${esc(b.kommission)}</dd>
          <dt>Menge</dt><dd>${esc(b.menge)}</dd>
          <dt>Material / Beschreibung</dt><dd>${esc(b.material)}</dd></dl></div></div>
      ${b.bild ? `<dl><dt>Bild</dt></dl><div class="foto"><img src="${b.bild}" alt="Bild" data-a="gross"></div>` : ""}
      <div class="info">${sym("person", 24)}<div><small>Muss bestellt werden von:</small>${esc(b.person)}</div></div>
      <div class="info">${sym("uhr", 24)}<div><small>Erstellt am</small>${datumZeit(b.erstellt)}</div></div>
    </div>
    <div class="status-wahl">${sw("offen")}${sw("bearbeitung")}${sw("erledigt")}</div>
    <button class="knopf" data-a="bearbeiten">${sym("stift", 20)}Bearbeiten</button>
  </main>`;
}

function formNeu(b) {
  S.form = b ? { ...b } : { id: null, artikel: "", menge: "", material: "", bild: "", kommission: "", person: D.ich || "", status: "offen" };
}
function vForm() {
  const f = S.form, neu = !f.id;
  const wahl = (art, icon, t, wert) => `<button class="feld wahl" data-a="wahl" data-w="${art}" id="f-${art}">${sym(icon, 24)}
    <div class="fi"><label>${t} *</label><div class="wert ${wert ? "" : "leer2"}">${esc(wert || "Bitte wählen")}</div></div>${sym("runter", 22)}</button>`;
  return `${kopf()}${titel(neu ? "Neue Bestellung" : "Bestellung bearbeiten")}
  <main class="inhalt">
    <label class="feld" id="f-artikel">${sym("paket", 24)}<div class="fi"><label>Artikel *</label><input data-f="artikel" value="${esc(f.artikel)}" placeholder="z. B. Schrauben, Farbe, Werkzeug …"></div></label>
    <label class="feld" id="f-menge">${sym("raute", 24)}<div class="fi"><label>Menge *</label><input data-f="menge" value="${esc(f.menge)}" placeholder="z. B. 10 Stk."></div></label>
    <label class="feld" id="f-material">${sym("datei", 24)}<div class="fi"><label>Material / Beschreibung *</label><textarea data-f="material" rows="1" placeholder="z. B. Holz, Farbe, Grösse …">${esc(f.material)}</textarea></div></label>
    <div class="feld block"><div class="kopfzeile">${sym("kamera", 24)}<div class="fi"><label>Bild anhängen</label></div></div>
      ${f.bild ? `<div class="vorschau"><img src="${f.bild}" alt=""><button data-a="bildweg">Entfernen</button></div>`
        : `<div class="ablage" id="ablage" data-a="bildwahl">${sym("kamera", 26)}<span>Bild auswählen oder<br>hier ablegen</span></div>`}
      <input type="file" id="datei" accept="image/*" hidden></div>
    ${wahl("kommission", "leute", "Kommission", f.kommission)}
    ${wahl("person", "leute", "Muss bestellt werden von:", f.person)}
    ${neu ? "" : `<div class="gruppe-titel">Status</div><div class="status-wahl">${["offen", "bearbeitung", "erledigt"].map((k) => `<button data-a="fstatus" data-w="${k}" class="${k} ${f.status === k ? "an" : ""}">${STATUS[k]}</button>`).join("")}</div>`}
    <button class="knopf" data-a="senden" style="margin-top:12px">${sym(neu ? "senden" : "stift", 20)}${neu ? "Bestellung senden" : "Speichern"}</button>
    ${neu ? "" : `<button class="knopf grau" data-a="loeschen" style="margin-top:10px">${sym("muell", 20)}Bestellung löschen</button>`}
  </main>`;
}

// Auswahl Kommission oder Person, wie auf dem Bild unten rechts
function vWahl() {
  const f = S.form, art = S.wahl;
  const liste = art === "person" ? D.leute : D.kom;
  const kopfFeld = (a, icon, t, w) => `<button class="feld wahl" data-a="wahl" data-w="${a}">${sym(icon, 24)}<div class="fi"><label>${t} *</label><div class="wert ${w ? "" : "leer2"}">${esc(w || "Bitte wählen")}</div></div>${sym("runter", 22)}</button>`;
  return `${titel(f.id ? "Bestellung bearbeiten" : "Neue Bestellung")}
  <main class="inhalt">
    ${kopfFeld("kommission", "leute", "Kommission", f.kommission)}
    ${kopfFeld("person", "person", "Muss bestellt werden von:", f.person)}
    <div class="gruppe-titel">${art === "person" ? "Mitarbeitende" : "Kommissionen"}</div>
    <div class="liste-kasten">${liste.length ? liste.map((n) => `<button class="radio ${f[art] === n ? "an" : ""}" data-a="waehle" data-w="${esc(n)}"><span class="kreis"></span>${esc(n)}</button>`).join("")
      : `<div class="leer">Noch keine Einträge. Im Menü unter ${art === "person" ? "Mitarbeitende" : "Kommissionen"} hinzufügen.</div>`}</div>
  </main>`;
}

function vMenue() {
  const p = (a, icon, t, an) => `<button data-a="${a}" class="${an ? "an" : ""}">${sym(icon, 24)}<span>${t}</span>${sym("rechts", 20)}</button>`;
  return `<div class="menue"><div class="marke-gross">${marke(56)}<button data-a="zu" aria-label="Schliessen">${sym("x", 26)}</button></div>
    <nav>${p("liste", "paket", "Bestellungen", true)}${p("neu", "plus", "Neue Bestellung")}${p("uebersicht", "haus", "Übersicht")}
    ${p("kommissionen", "leute", "Kommissionen")}${p("mitarbeitende", "person", "Mitarbeitende")}<hr>
    <button data-a="einstellungen">${sym("zahnrad", 24)}<span>Einstellungen</span></button>
    <button data-a="abmelden">${sym("abmelden", 24)}<span>Abmelden</span></button></nav></div>`;
}

function vUebersicht() {
  const z = (st) => D.bestellungen.filter((b) => b.status === st).length;
  const kachel = (st) => `<button class="karte" data-a="filterliste" data-w="${st}" style="flex-direction:column;align-items:flex-start;gap:6px">${schild(st)}<b style="font-size:28px">${z(st)}</b></button>`;
  const jeKom = D.kom.map((k) => {
    const n = D.bestellungen.filter((b) => b.kommission === k && b.status !== "erledigt").length;
    return `<button class="zeile-verw" data-a="suchliste" data-w="${esc(k)}" style="width:100%;text-align:left"><span>${esc(k)}</span><small>${n} offen</small>${sym("rechts", 18)}</button>`;
  }).join("");
  return `${kopf()}${titel("Übersicht")}<main class="inhalt">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${kachel("offen")}${kachel("bearbeitung")}${kachel("erledigt")}</div>
    <div class="gruppe-titel">Offen je Kommission</div><div class="liste-kasten">${jeKom || `<div class="leer">Keine Kommissionen.</div>`}</div>
  </main>${unten("")}`;
}

function vVerwalten(art) {
  const istP = art === "mitarbeitende", liste = istP ? D.leute : D.kom;
  const feld = istP ? "person" : "kommission";
  return `${kopf()}${titel(istP ? "Mitarbeitende" : "Kommissionen")}<main class="inhalt">
    <div class="liste-kasten">${liste.map((n, i) => {
      const anz = D.bestellungen.filter((b) => b[feld] === n && b.status !== "erledigt").length;
      return `<div class="zeile-verw">${sym(istP ? "person" : "leute", 20)}<span>${esc(n)}</span><small>${anz} offen</small><button data-a="weg" data-w="${i}" aria-label="Entfernen">${sym("muell", 18)}</button></div>`;
    }).join("") || `<div class="leer">Noch keine Einträge.</div>`}</div>
    <div class="neu-zeile"><input id="neuname" placeholder="${istP ? "Name eingeben" : "Kommission eingeben"}"><button class="knopf klein" data-a="dazu">${sym("plus", 18)}Hinzufügen</button></div>
  </main>${unten("")}`;
}

function vProfil() {
  const ich = D.ich;
  const meine = D.bestellungen.filter((b) => b.person === ich && b.status !== "erledigt");
  return `${kopf()}${titel("Profil", false)}<main class="inhalt">
    <div class="profil-bild">${ich ? esc(ich.split(" ").map((w) => w[0]).join("").slice(0, 2)) : sym("person", 30)}</div>
    <div class="gruppe-titel">Wer bin ich?</div>
    <div class="liste-kasten">${D.leute.map((n) => `<button class="radio ${ich === n ? "an" : ""}" data-a="ich" data-w="${esc(n)}"><span class="kreis"></span>${esc(n)}</button>`).join("")}</div>
    ${ich ? `<div class="gruppe-titel">Muss ich bestellen (${meine.length})</div>${karten(meine)}` : `<p class="text-leise" style="margin-top:12px">Wähle deinen Namen. Neue Bestellungen schlagen dich dann vor.</p>`}
  </main>${unten("profil")}`;
}

function vEinstellungen() {
  return `${kopf()}${titel("Einstellungen")}<main class="inhalt">
    <p class="text-leise">Die Bestellungen sind im Moment nur auf diesem Gerät gespeichert. Für gemeinsame Daten auf allen Geräten kommt später eine Datenbank dazu.</p>
    <div class="gruppe-titel">Daten</div>
    <button class="knopf grau" data-a="beispiel">Beispieldaten wiederherstellen</button>
    <button class="knopf grau" data-a="allesweg" style="margin-top:10px">${sym("muell", 20)}Alle Bestellungen löschen</button>
  </main>${unten("")}`;
}

function zeichne() {
  const v = { start: vStart, liste: vListe, detail: vDetail, form: vForm, wahl: vWahl, menue: vMenue, uebersicht: vUebersicht,
    kommissionen: () => vVerwalten("kommissionen"), mitarbeitende: () => vVerwalten("mitarbeitende"), profil: vProfil, einstellungen: vEinstellungen }[S.ansicht];
  app.innerHTML = v();
  app.querySelectorAll("textarea").forEach(hoehe);
  const ablage = document.getElementById("ablage");
  if (ablage) {
    ablage.addEventListener("dragover", (e) => { e.preventDefault(); ablage.classList.add("drueber"); });
    ablage.addEventListener("dragleave", () => ablage.classList.remove("drueber"));
    ablage.addEventListener("drop", (e) => { e.preventDefault(); ablage.classList.remove("drueber"); const d = e.dataTransfer.files[0]; if (d) bildLesen(d); });
  }
}
const hoehe = (t) => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };

// Bild verkleinern, damit es im Gerätespeicher Platz hat
function bildLesen(datei) {
  if (!datei.type.startsWith("image/")) return meldung("Bitte ein Bild wählen.");
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, f = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      S.form.bild = c.toDataURL("image/jpeg", 0.8); zeichne();
    };
    img.onerror = () => meldung("Bild liess sich nicht lesen.");
    img.src = r.result;
  };
  r.readAsDataURL(datei);
}

// ---------- Ereignisse ----------
app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "suche") { S.suche = t.value; document.getElementById("karten").innerHTML = karten(D.bestellungen.filter(passt).sort((a, b) => b.erstellt.localeCompare(a.erstellt))); return; }
  if (t.dataset.f) { S.form[t.dataset.f] = t.value; t.closest(".feld").classList.remove("fehler"); if (t.tagName === "TEXTAREA") hoehe(t); }
});
app.addEventListener("change", (e) => { if (e.target.id === "datei" && e.target.files[0]) bildLesen(e.target.files[0]); });
app.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "neuname") app.querySelector('[data-a="dazu"]').click(); });

app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, w = el.dataset.w;
  switch (a) {
    case "liste": S.zurueck = []; S.ansicht = "liste"; zeichne(); break;
    case "menue": gehe("menue"); break;
    case "zu": case "zurueck": zurueck(); break;
    case "filter": S.filter = w; zeichne(); break;
    case "filterliste": S.filter = w; S.suche = ""; S.zurueck = []; S.ansicht = "liste"; zeichne(); break;
    case "suchliste": S.filter = "alle"; S.suche = w; S.zurueck = []; S.ansicht = "liste"; zeichne(); break;
    case "detail": gehe("detail", { id: el.dataset.id }); break;
    case "neu": formNeu(); if (S.ansicht === "menue") S.zurueck.pop(), S.ansicht = "liste"; gehe("form"); break;
    case "bearbeiten": formNeu(D.bestellungen.find((b) => b.id === S.id)); gehe("form"); break;
    case "status": { const b = D.bestellungen.find((x) => x.id === S.id); b.status = w; speichern(); zeichne(); meldung("Status: " + STATUS[w]); break; }
    case "fstatus": S.form.status = w; zeichne(); break;
    case "bildwahl": document.getElementById("datei").click(); break;
    case "bildweg": S.form.bild = ""; zeichne(); break;
    case "wahl": S.wahl = w; if (S.ansicht === "wahl") zeichne(); else gehe("wahl"); break;
    case "waehle": S.form[S.wahl] = w; zurueck(); break;
    case "senden": senden(); break;
    case "loeschen":
      if (!confirm("Bestellung wirklich löschen?")) break;
      D.bestellungen = D.bestellungen.filter((b) => b.id !== S.form.id); speichern();
      S.zurueck = []; S.ansicht = "liste"; zeichne(); meldung("Bestellung gelöscht"); break;
    case "uebersicht": case "kommissionen": case "mitarbeitende": case "einstellungen":
      S.zurueck = [{ ansicht: "liste" }]; S.ansicht = a; zeichne(); window.scrollTo(0, 0); break;
    case "profil": S.zurueck = []; S.ansicht = "profil"; zeichne(); break;
    case "ich": D.ich = w; speichern(); zeichne(); break;
    case "abmelden": S.zurueck = []; S.ansicht = "start"; zeichne(); break;
    case "dazu": {
      const inp = document.getElementById("neuname"), n = inp.value.trim(); if (!n) break;
      const l = S.ansicht === "mitarbeitende" ? D.leute : D.kom;
      if (l.includes(n)) { meldung("Gibt es schon"); break; }
      l.push(n); speichern(); zeichne(); document.getElementById("neuname").focus(); break;
    }
    case "weg": {
      const l = S.ansicht === "mitarbeitende" ? D.leute : D.kom;
      if (!confirm(`„${l[+w]}“ entfernen? Bestehende Bestellungen bleiben.`)) break;
      l.splice(+w, 1); speichern(); zeichne(); break;
    }
    case "gross": { const g = document.createElement("div"); g.className = "gross-bild"; g.innerHTML = `<img src="${el.src}" alt="">`; g.onclick = () => g.remove(); document.body.append(g); break; }
    case "beispiel": if (confirm("Alle Daten durch die Beispieldaten ersetzen?")) { D = vorgabe(); speichern(); meldung("Beispieldaten geladen"); } break;
    case "allesweg": if (confirm("Alle Bestellungen löschen?")) { D.bestellungen = []; speichern(); meldung("Alle Bestellungen gelöscht"); } break;
  }
});

function senden() {
  const f = S.form; let fehlt = [];
  for (const k of ["artikel", "menge", "material", "kommission", "person"]) if (!String(f[k] || "").trim()) fehlt.push(k);
  fehlt.forEach((k) => document.getElementById("f-" + k)?.classList.add("fehler"));
  if (fehlt.length) return meldung("Bitte alle Felder mit * ausfüllen.");
  if (f.id) {
    const i = D.bestellungen.findIndex((b) => b.id === f.id); D.bestellungen[i] = { ...D.bestellungen[i], ...f };
    speichern(); S.zurueck.pop(); S.ansicht = "detail"; S.id = f.id; zeichne(); meldung("Gespeichert");
  } else {
    const b = { ...f, id: neueId(), status: "offen", erstellt: jetzt() };
    D.bestellungen.push(b); speichern(); S.zurueck = []; S.filter = "alle"; S.suche = ""; S.ansicht = "liste"; zeichne(); meldung("Bestellung gesendet");
  }
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.ansicht !== "start" && S.ansicht !== "liste") zurueck(); });
zeichne();

</script></body></html>
