<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SÜMI Schreinerei · Bestellungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --grund:#121316; --flaeche:#1b1d21; --flaeche2:#22252a; --rand:#30343a;
  --text:#f2f3f5; --leise:#9aa0a8; --pink:#cc0066; --pink-dunkel:#4f0b2a;
  --orange:#f08a1c; --gruen:#2fae5b; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--grund);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Kopf */
.kopf{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rand);position:sticky;top:0;background:var(--grund);z-index:5;padding-top:calc(14px + env(safe-area-inset-top))}
.marke{display:flex;align-items:center;gap:10px}
.marke .wort{line-height:1}
.marke .wort b{display:block;font-size:19px;letter-spacing:.32em;font-weight:500}
.marke .wort small{display:block;font-size:7.5px;letter-spacing:.38em;color:var(--leise);margin-top:3px}
.titelzeile{display:flex;align-items:center;gap:14px;padding:20px 18px 6px}
.titelzeile h1{font-size:22px;font-weight:600;flex:1}
.zurueck{padding:4px;margin-left:-4px}
.inhalt{flex:1;padding:12px 18px 110px}

/* Start */
.start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;
  background:radial-gradient(ellipse at 70% 110%,#3a2a1e 0%,transparent 55%),linear-gradient(160deg,#16171a 0%,#121316 55%,#1d1712 100%)}
.start .gross b{display:block;font-size:56px;font-weight:500;letter-spacing:.34em;margin:28px 0 8px -0.34em;padding-left:.34em}
.start .gross small{font-size:16px;letter-spacing:.42em;color:#ddd}
.start p{margin-top:56px;font-size:20px;line-height:1.4;color:#ddd}
.start .strich{width:60px;height:3px;background:var(--pink);margin:28px auto 56px;border-radius:2px}
.knopf{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--pink);color:#fff;border-radius:10px;padding:14px;font-weight:600;font-size:16px}
.knopf:active{filter:brightness(.9)}
.knopf.klein{width:auto;padding:9px 14px;font-size:14px}
.knopf.grau{background:var(--flaeche2);border:1px solid var(--rand)}

/* Suche und Filter */
.suche{display:flex;align-items:center;gap:10px;border:1px solid var(--rand);border-radius:10px;padding:10px 12px;background:var(--flaeche);margin:12px 0}
.suche input{flex:1;background:none;border:0;outline:0;font-size:14px}
.suche svg{color:var(--leise)}
.filter{display:grid;grid-template-columns:auto 1fr 1.4fr 1fr;gap:8px;margin-bottom:14px}
.filter button{border:1px solid var(--rand);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:500;background:var(--flaeche)}
.filter button.an{background:var(--pink);border-color:var(--pink)}

/* Karten */
.karte{display:flex;gap:14px;align-items:center;background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:12px;margin-bottom:10px;width:100%;text-align:left}
.karte .bild{width:68px;height:68px;border-radius:8px;flex:none;overflow:hidden;background:var(--flaeche2);display:flex;align-items:center;justify-content:center;color:var(--leise)}
.karte .bild img{width:100%;height:100%;object-fit:cover}
.karte .mitte{flex:1;min-width:0}
.karte h3{font-size:15px;font-weight:600;margin-bottom:3px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.karte h3 span{overflow:hidden;text-overflow:ellipsis}
.karte .zeile{font-size:12.5px;color:var(--leise);line-height:1.45}
.karte .zeile b{color:var(--text);font-weight:500}
.karte > svg{color:var(--leise)}
.schild{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap;flex:none}
.schild.offen{background:var(--pink)}
.schild.bearbeitung{background:var(--orange);color:#2a1500}
.schild.erledigt{background:var(--gruen)}
.leer{color:var(--leise);text-align:center;padding:40px 10px}

/* Formular */
.feld{display:flex;gap:14px;align-items:center;background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;position:relative}
.feld:focus-within{border-color:var(--pink)}
.feld > svg{color:var(--text)}
.feld .fi{flex:1;min-width:0}
.feld label{display:block;font-size:13px;font-weight:500;margin-bottom:3px}
.feld input,.feld textarea{width:100%;background:none;border:0;outline:0;font-size:13.5px;color:var(--text)}
.feld input::placeholder,.feld textarea::placeholder{color:var(--leise)}
.feld textarea{resize:none;min-height:20px}
.feld.fehler{border-color:var(--pink)}
.feld.wahl{cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.feld.wahl .wert{font-size:14px;color:var(--text)}
.feld.wahl .wert.leer2{color:var(--leise)}
.ablage{border:1.5px dashed #555b63;border-radius:10px;padding:18px;text-align:center;font-size:13px;color:#ddd;margin-top:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.ablage.drueber{border-color:var(--pink);background:#2a1620}
.vorschau{position:relative;margin-top:10px}
.vorschau img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;display:block}
.vorschau button{position:absolute;top:8px;right:8px;background:#000a;border-radius:20px;padding:6px 10px;font-size:12px}
.feld.block{display:block}
.feld.block .kopfzeile{display:flex;gap:14px;align-items:center}

/* Auswahl-Blatt */
.huelle{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:ein .15s}
.blatt{background:var(--flaeche);border-top-left-radius:18px;border-top-right-radius:18px;width:100%;max-width:560px;max-height:80vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.blatt h2{font-size:17px;font-weight:600;margin-bottom:12px}
.radio{display:flex;gap:14px;align-items:center;padding:11px 6px;width:100%;text-align:left;font-size:14.5px;border-bottom:1px solid var(--rand)}
.radio:last-child{border-bottom:0}
.radio .kreis{width:20px;height:20px;border-radius:50%;border:1.8px solid #cfd3d8;flex:none;display:flex;align-items:center;justify-content:center}
.radio.an .kreis{border-color:var(--pink)}
.radio.an .kreis::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pink)}
.gruppe-titel{font-size:15px;font-weight:600;margin:18px 0 10px}
.liste-kasten{background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:4px 12px}
@keyframes ein{from{opacity:0}}

/* Details */
.detail{background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:14px}
.detail .oben{display:flex;gap:16px}
.detail .oben .bild{width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--flaeche2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--leise)}
.detail .oben img{width:100%;height:100%;object-fit:cover}
.detail h2{font-size:18px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}
.detail dt{font-size:13px;color:var(--leise);margin-top:10px}
.detail dd{font-size:14px;margin-top:2px;white-space:pre-wrap}
.detail .foto{margin-top:14px}
.detail .foto img{width:100%;max-height:260px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.detail .info{display:flex;gap:14px;align-items:center;border-top:1px solid var(--rand);margin-top:14px;padding-top:14px}
.detail .info + .info{border-top:0;margin-top:0}
.detail .info small{display:block;font-size:12px;color:var(--leise)}
.status-wahl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.status-wahl button{border:1px solid var(--rand);border-radius:8px;padding:9px 4px;font-size:13px;background:var(--flaeche)}
.status-wahl button.an.offen{background:var(--pink);border-color:var(--pink)}
.status-wahl button.an.bearbeitung{background:var(--orange);border-color:var(--orange);color:#2a1500}
.status-wahl button.an.erledigt{background:var(--gruen);border-color:var(--gruen)}
.zweiknopf{display:flex;gap:10px;margin-top:10px}

/* Menü */
.menue{position:fixed;inset:0;background:var(--grund);z-index:40;display:flex;flex-direction:column;animation:ein .15s;max-width:560px;margin:0 auto}
.menue .marke-gross{display:flex;justify-content:space-between;align-items:center;padding:36px 22px 26px;padding-top:calc(36px + env(safe-area-inset-top))}
.menue nav{padding:0 14px}
.menue nav button{display:flex;align-items:center;gap:16px;width:100%;padding:14px 12px;border-radius:10px;font-size:15.5px;font-weight:500;margin-bottom:4px}
.menue nav button span{flex:1;text-align:left}
.menue nav button.an{background:var(--pink-dunkel);color:var(--pink);border:1px solid #7d1a3a}
.menue hr{border:0;border-top:1px solid var(--rand);margin:12px 4px}

/* Unten */
.unten{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--flaeche);border-top:1px solid var(--rand);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
.unten button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#ddd}
.unten button.an{color:var(--pink)}

/* Verwalten */
.zeile-verw{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--rand)}
.zeile-verw:last-child{border-bottom:0}
.zeile-verw span{flex:1}
.zeile-verw small{color:var(--leise);font-size:12px}
.zeile-verw button{color:var(--leise);padding:4px}
.neu-zeile{display:flex;gap:8px;margin-top:12px}
.neu-zeile input{flex:1;background:var(--flaeche);border:1px solid var(--rand);border-radius:10px;padding:11px 12px;outline:0}
.neu-zeile input:focus{border-color:var(--pink)}
.text-leise{color:var(--leise);font-size:13px;line-height:1.5}

.meldung{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2e34;border:1px solid var(--rand);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;animation:ein .2s;max-width:90%}
.gross-bild{position:fixed;inset:0;background:#000e;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.gross-bild img{max-width:100%;max-height:100%;border-radius:8px}
.profil-bild{width:72px;height:72px;border-radius:50%;background:var(--pink-dunkel);color:var(--pink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;margin:10px auto}

/* ===== v4: Anmelden, Team, Einstellungen, Leiste, Animationen ===== */
.ava{width:var(--g,40px);height:var(--g,40px);border-radius:50%;background:var(--f,var(--pink));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none;box-shadow:0 0 0 2px #0004}
.text-leise{color:var(--leise)}
small.block{display:block;color:var(--leise);margin-top:3px}

.anmelden{padding:calc(30px + env(safe-area-inset-top)) 20px 30px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;min-height:100vh}
.an-logo{margin-bottom:10px;animation:ein-oben .5s both}
.anmelden h1{font-size:24px;font-weight:600;animation:ein-oben .5s .05s both}
.anmelden>p{animation:ein-oben .5s .1s both;max-width:380px}
.an-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:100%;max-width:760px;margin-top:12px}
.an-kachel{background:var(--flaeche);border:1px solid var(--rand);border-radius:16px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .25s,border-color .25s,opacity .35s,filter .35s;animation:ein-pop .45s calc(.15s + var(--i,0)*.05s) both}
.an-kachel:hover{transform:translateY(-3px);border-color:var(--pink)}
.an-kachel b{font-weight:600}.an-kachel small{color:var(--leise);font-size:12px;min-height:14px}
.an-raster.gewaehlt-da .an-kachel:not(.gewaehlt){opacity:.15;transform:scale(.9);filter:blur(1px)}
.an-kachel.gewaehlt{transform:scale(1.08);border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-dunkel),0 10px 40px #e5175f40}
.neu-zeile{display:flex;gap:8px;width:100%;max-width:460px;margin-top:16px}
.neu-zeile input,.rein-zeile input{flex:1;min-width:0;background:var(--flaeche);border:1px solid var(--rand);border-radius:10px;padding:10px 12px}
.knopf.klein{padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px;width:auto}
.rein-zeile{display:flex;gap:8px;margin-top:10px}

/* Karten und Kacheln */
.karte{animation:ein-oben .4s calc(var(--i,0)*.04s) both}
.still .karte{animation:none}
.karte.neu-da{animation:ein-pop .5s both}
.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kachel{background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:14px;animation:ein-oben .4s calc(var(--i,0)*.05s) both}
.kachel .zahl{font-size:28px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.balken{height:8px;border-radius:4px;background:var(--flaeche2);overflow:hidden;margin-top:6px}
.balken i{display:block;height:100%;width:var(--w,0);background:var(--pink);border-radius:4px;animation:wachsen .8s calc(.2s + var(--i,0)*.06s) both cubic-bezier(.2,.8,.2,1);transform-origin:left}
.heute{color:var(--pink);font-weight:600}

/* Team */
.pers-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pers{background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%;transition:transform .2s,border-color .2s;animation:ein-oben .4s calc(var(--i,0)*.04s) both}
.pers:hover{transform:translateY(-2px);border-color:var(--pink)}
.pers>div{flex:1;min-width:0}.pers b{display:block}.pers small{color:var(--leise);font-size:12.5px}
.offen-zahl{min-width:26px;height:26px;border-radius:13px;background:var(--pink);color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.offen-zahl.null{background:var(--flaeche2);color:var(--leise)}
.geb{display:inline-flex;align-items:center;gap:4px;color:var(--orange)}
.pers-kopf{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0}
.pers-kopf .ava{animation:ein-pop .5s both}
.farben{display:flex;gap:8px;flex-wrap:wrap}
.farbe{width:30px;height:30px;border-radius:50%;background:var(--f);border:2px solid transparent;transition:transform .2s}
.farben.gross .farbe{width:40px;height:40px}
.farbe:hover{transform:scale(1.12)}
.farbe.an{border-color:#fff;box-shadow:0 0 0 3px var(--f)}
.haken-zeile{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--rand);width:100%;text-align:left}
.kasten{width:22px;height:22px;border-radius:6px;border:2px solid var(--rand);display:inline-flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;flex:none}
.kasten svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:.25s}
.kasten.an{background:var(--pink);border-color:var(--pink)}
.kasten.an svg{opacity:1;transform:scale(1);color:#fff}
.profil-karte{background:var(--flaeche);border:1px solid var(--rand);border-radius:16px;padding:20px;text-align:center;animation:ein-pop .45s both}
.radio .rt b{display:block}.radio .rt small{color:var(--leise)}
.feld select{width:100%;background:var(--flaeche2);border:1px solid var(--rand);border-radius:10px;padding:10px 12px;appearance:auto}
select.gespeichert{animation:blitz .8s}

/* Einstellungen */
.einst section{margin-bottom:22px;animation:ein-oben .4s calc(var(--i,0)*.06s) both}
.einst section h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--leise);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.eb-block{background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:14px}
.eb-block+.eb-block{margin-top:10px}
.eb-titel{font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--flaeche2);border:1px solid var(--rand);border-radius:16px;padding:5px 6px 5px 12px;font-size:13.5px;animation:ein-pop .3s both}
.chip button{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--leise)}
.chip button:hover{background:var(--pink-dunkel);color:var(--pink)}
.chip svg{width:14px;height:14px}
.zuweisen{display:flex;flex-direction:column}
.zw-zeile{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rand)}
.zw-zeile:last-child{border-bottom:0}
.zw-zeile select{background:var(--flaeche2);border:1px solid var(--rand);border-radius:8px;padding:8px}
.schalter-zeile{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;width:100%;text-align:left}
.schalter-zeile small{display:block;color:var(--leise);font-size:12.5px}
.schalter{width:46px;height:26px;border-radius:13px;background:var(--flaeche2);border:1px solid var(--rand);position:relative;transition:background .25s;flex:none}
.schalter i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#ccc;transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .25s}
.schalter.an{background:var(--pink);border-color:var(--pink)}
.schalter.an i{transform:translateX(20px);background:#fff}

/* Rückmeldungen */
.schild.pop{animation:ein-pop .45s both}
.meldung{animation:toast .35s cubic-bezier(.2,.9,.3,1.3) both}
.meldung.weg{animation:toast-weg .3s both}
.fehler{animation:wackeln .4s}

/* Wechsel zwischen Ansichten */
.ansicht{flex:1;display:flex;flex-direction:column}
.r-vor{animation:von-rechts .32s cubic-bezier(.2,.8,.2,1) both}
.r-zurueck{animation:von-links .32s cubic-bezier(.2,.8,.2,1) both}
.r-reiter{animation:ein-oben .3s ease-out both}
.r-rein{animation:ein-zoom .45s cubic-bezier(.2,.8,.2,1) both}
.st1{animation:ein-pop .7s both}.st2{animation:ein-oben .6s .15s both}.st3{animation:ein-oben .6s .3s both}.st4{animation:strich .6s .45s both;transform-origin:center}.st5{animation:ein-oben .6s .55s both}
@keyframes von-rechts{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes von-links{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes ein-oben{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ein-pop{0%{opacity:0;transform:scale(.85)}60%{opacity:1;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes ein-zoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes wachsen{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes strich{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blitz{0%{box-shadow:0 0 0 0 var(--pink)}40%{box-shadow:0 0 0 3px var(--pink)}to{box-shadow:0 0 0 0 transparent}}
@keyframes toast{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toast-weg{to{opacity:0;transform:translate(-50%,20px)}}
@keyframes wackeln{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes icon-pop{0%{transform:scale(1)}40%{transform:scale(1.3)}to{transform:scale(1)}}

/* Leiste: Handy unten, immer da */
body.mit-leiste #app{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.unten{grid-template-columns:repeat(5,1fr)}
.unten .kurz{white-space:nowrap;font-size:11px}
.unten .nur-pc,.unten .lang{display:none}
.unten button{position:relative;padding:2px 0;transition:color .2s}
.unten button svg{transition:transform .2s}
.unten button.an svg{animation:icon-pop .4s}
.unten button.an::before{content:"";position:absolute;top:-8px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--pink)}

@media (min-width:900px){
  body.mit-leiste #app{padding:0 0 0 250px;max-width:none}
  body.mit-leiste .ansicht{width:100%;max-width:900px;margin:0 auto}
  body.mit-leiste .kopf.haupt{display:none}
  .unten{top:0;bottom:0;right:auto;width:250px;max-width:none;margin:0;display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-top:0;border-right:1px solid var(--rand)}
  .unten .nur-pc{display:flex}
  .unten .lang{display:inline}.unten .kurz{display:none}
  .unten>button{flex-direction:row;gap:12px;font-size:14.5px;padding:11px 14px;border-radius:10px;color:#cfd2d6;justify-content:flex-start}
  .unten>button:hover{background:var(--flaeche2)}
  .unten>button.an{background:var(--pink-dunkel);color:#fff}
  .unten>button.an::before{top:8px;bottom:8px;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .nav-marke{padding:0 6px 22px;border-bottom:1px solid var(--rand);margin-bottom:14px}
  .nav-ich{margin-top:auto;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid var(--rand)}
  .nav-ich>div{flex:1;min-width:0}.nav-ich b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-ich small{display:block;color:var(--leise);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-ich button{color:var(--leise);padding:6px;border-radius:8px}.nav-ich button:hover{color:var(--pink);background:var(--flaeche2)}
  #karten{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .meldung{bottom:30px}
  .r-vor{animation-name:von-rechts}
}
@media (min-width:900px){body:not(.mit-leiste) #app{max-width:none}}

body.ohne-anim *,body.ohne-anim *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
.zw-zeile{grid-template-columns:auto 1fr 1fr;grid-template-areas:"a n n" "s1 s1 s2"}
.zw-zeile>.ava,.zw-zeile>svg{grid-area:a}.zw-zeile>b{grid-area:n}
.zw-zeile>select:nth-of-type(1){grid-area:s1;grid-column:1/3}.zw-zeile>select:nth-of-type(2){grid-area:s2}
.zuweisen+.eb-titel{margin-top:16px}
.zuweisen{background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:4px 14px;margin-bottom:10px}
.haken-zeile small{margin-left:auto;color:var(--leise);font-size:12px}
@media (min-width:700px){.zw-zeile{grid-template-columns:32px 1.2fr 1fr 1fr;grid-template-areas:"a n s1 s2"}.zw-zeile>select:nth-of-type(1){grid-column:auto}}
button.zeile-verw{width:100%;text-align:left}
.zeile-verw span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile-verw small{white-space:nowrap}
.ava{aspect-ratio:1;min-width:var(--g,40px);min-height:var(--g,40px)}
.zeile-verw span.ava{flex:none;overflow:visible}
.marke img{display:block;border-radius:4px}
.start-banner{width:min(520px,88vw);display:block;margin:0 auto}
.feld.block .kopfzeile .fi{flex:1;min-width:0}
.seg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--rand);background:var(--flaeche2,transparent);font-size:14px;color:var(--text);transition:background .15s,border-color .15s}
.seg button.an{border-color:var(--pink);background:#3a1a28;color:#fff;font-weight:600}
.seg.breit{display:grid;grid-template-columns:1fr 1fr}
.menge-zeile{display:flex;gap:10px;align-items:center}.menge-zeile input{flex:1;min-width:0}
#kominput{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--rand);background:transparent;color:var(--text);font:inherit}
.plaene{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.plan-zeile{display:flex;align-items:center;gap:8px;border:1px solid var(--rand);border-radius:10px;padding:4px 6px 4px 10px;background:var(--flaeche)}
.plan-oeffnen{flex:1;min-width:0;text-align:left;padding:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.plan-oeffnen:hover{color:var(--pink)}
.plan-weg{padding:6px 10px;border-radius:8px;color:var(--leise)}.plan-weg:hover{color:var(--pink)}
.gross-bild{position:fixed;inset:0;background:#000e;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.gross-bild img{max-width:100%;max-height:100%;border-radius:8px}
.an-raster{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));max-width:980px;grid-auto-rows:1fr}
.an-kachel{padding:22px 12px}.an-kachel b{font-size:17px}
.knopf{min-height:50px}.knopf.klein{min-height:40px}
.nur-lesen{pointer-events:none;opacity:.55}.nur-lesen h2::after{content:"nur Admin";margin-left:auto;font-size:12px;font-weight:600;color:var(--leise);background:var(--flaeche2);padding:3px 8px;border-radius:99px}.marke{cursor:pointer}

/* 26.11.: saubere Proportionen, Team je Stufe, Leiste ohne Team am Handy */
.filter{grid-template-columns:repeat(4,1fr)}
.filter button{padding:9px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.karte{align-items:center}
.karte .bild{width:60px;height:60px}
.karte h3{align-items:center;line-height:1.3}
.karte h3 span{white-space:nowrap}
.karte .zeile{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.karte .zeile.wer{display:flex;align-items:center;gap:6px}
.karte .zeile.wer .ava{box-shadow:none}
.stufe{margin-bottom:6px}
.pers-linie{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.pers-linie .pers{flex:0 0 240px;width:240px;scroll-snap-align:start}
.pers .mitte b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pers small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unten{grid-template-columns:repeat(5,1fr)}
.team-knopf{width:100%;justify-content:center;margin:4px 0 14px}
.marke img{border-radius:0}
@media (min-width:900px){.unten>button{order:var(--o,0)}.unten .nav-ich{order:10}.nur-handy{display:none!important}
  .pers-linie{flex-wrap:wrap;overflow:visible}}

/* Anmeldung: nur Bild und Name, am Handy kompakt; Schreiner-Animation (Hobelspäne, Hobel) */
.anmelden{position:relative;overflow:hidden}.anmelden.saegt{overflow:visible}html:has(.anmelden.saegt){overflow:hidden}
.an-kachel{position:relative}
/* Säge-Anmeldung: die anderen fliegen weg, die gewählte in die Mitte, Säge, Seite teilt sich */
.an-raster.saegt .an-kachel{animation:none!important;transition:transform 1.05s cubic-bezier(.35,.05,.55,1) var(--v,0s),opacity .3s ease-in calc(var(--v,0s) + .75s)}
.an-raster.saegt .an-kachel.an-weg{transform:translate(var(--x),var(--y)) scale(.8) rotate(var(--r));opacity:0}
.an-raster.saegt .an-kachel.gewaehlt{z-index:5;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.an-raster.saegt ~ *,.anmelden.saegt>:not(.an-raster){transition:opacity .4s;opacity:0}
.an-saege{position:fixed;left:0;right:0;height:0;z-index:60;pointer-events:none}
.an-schnitt{position:absolute;left:0;top:-1px;height:2px;width:0;background:linear-gradient(90deg,transparent,#fff,var(--pink));box-shadow:0 0 12px var(--pink);animation:schnitt 1.3s cubic-bezier(.4,0,.6,1) forwards}
@keyframes schnitt{to{width:100%}}
.an-blatt{position:absolute;top:-62px;left:-230px;width:220px;height:90px;filter:drop-shadow(0 6px 10px #000a);animation:blatt-fahrt 1.3s cubic-bezier(.4,0,.6,1) forwards}
.an-blatt svg{width:100%;height:100%;overflow:visible;animation:blatt-zug .22s ease-in-out infinite alternate}
@keyframes blatt-fahrt{to{left:calc(100% + 10px)}}
@keyframes blatt-zug{from{transform:translateX(-22px) rotate(-1.5deg)}to{transform:translateX(22px) rotate(1deg)}}
.an-staub{position:absolute;top:-3px;width:6px;height:6px;border-radius:50%;background:#e8c08a;opacity:0;animation:staub .6s var(--t) ease-out forwards}
@keyframes staub{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
.an-haelfte{position:fixed;inset:0;z-index:55;overflow:hidden;pointer-events:none;transition:transform .7s cubic-bezier(.6,0,.3,1)}
.an-haelfte.oben{clip-path:inset(0 0 50% 0)}.an-haelfte.unten{clip-path:inset(50% 0 0 0)}
.an-haelfte.oben.weg{transform:translateY(-100%)}.an-haelfte.unten.weg{transform:translateY(100%)}
@media (max-width:600px){
  .anmelden{gap:8px;padding-top:calc(20px + env(safe-area-inset-top))}
  .anmelden h1{font-size:20px}
  .an-raster{grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .an-kachel{padding:10px 4px;gap:6px;border-radius:12px}
  .an-kachel .ava{width:56px!important;height:56px!important;--g:56px!important;font-size:21px!important}
  .an-kachel b{font-size:12px;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
}
.abmelden-gross{width:100%;margin-top:18px;justify-content:center}

// Ältere Bestellungen (Artikel + Material getrennt, Kommission als Name) in die neue Form bringen
function bestellungNeu(b) {
  if (b.komArt) return b;
  const titel = [b.artikel, b.material].filter(Boolean).join(" – ");
  const m = String(b.menge || "").match(/^\s*([\d.,]+)\s*(.*)$/);
  const einheit = m && /pack/i.test(m[2]) ? "Pack" : m && /paar/i.test(m[2]) ? "Paar" : "Stk.";
  const lager = !b.kommission || /^lager$/i.test(b.kommission);
  return { ...b, material: titel, artikelnr: "", menge: m ? m[1] : String(b.menge || ""), einheit, komArt: lager ? "lager" : "kom", kommission: lager ? "" : b.kommission };
}

// Ältere Fassung übernehmen: Bestellungen bleiben, Mitarbeitende und Listen kommen neu von Sümi
function laden() {
  try {
    const d = JSON.parse(localStorage.getItem(SPEICHER));
    if (d) { const v = Object.assign(vorgabe(), d, { einst: { ...vorgabe().einst, ...(d.einst || {}) } }); v.kom.forEach((k) => (k.plaene ||= [])); return v; }
    const alt = JSON.parse(localStorage.getItem("suemi.app.v4"));
    if (alt) {
      const v = vorgabe();
      v.bestellungen = (alt.bestellungen || []).map(bestellungNeu).map((b) => ({ ...b, person: v.leute.some((p) => p.name === b.person) ? b.person : "" }));
      return v;
    }
  } catch {}
  return vorgabe();
}

}

function saegen(el, fertig) {

  const sw = (k) => `<button data-a="status" data-w="${k}" class="${k} ${b.status === k ? "an" : ""}">${STATUS[k]}</button>`;
  const p = person(b.person);
  return `${kopf()}${titel("Bestelldetails")}
  <main class="inhalt">
    <div class="detail">
      <div class="oben"><div class="bild">${bildKlein(b, 34)}</div>
        <div style="flex:1;min-width:0"><h2><span>${esc(b.material)}</span><span id="schild">${schild(b.status)}</span></h2>
          <dl>${b.artikelnr ? `<dt>Artikel Nr.</dt><dd>${esc(b.artikelnr)}</dd>` : ""}
          <dt>Menge</dt><dd>${esc(mengeText(b))}</dd>
          <dt>Kommission</dt><dd>${esc(komText(b))}</dd></dl></div></div>
      ${planListe(b.komArt === "kom" ? D.kom.find((k) => k.name === b.kommission) : null, false)}
      ${b.bild ? `<dl><dt>Bild</dt></dl><div class="foto"><img src="${b.bild}" alt="Bild" data-a="gross"></div>` : ""}
      <div class="info">${ava(b.person, 28)}<div><small>Muss bestellt werden von:</small>${esc(b.person)}${p?.funktion ? ` <span class="text-leise">· ${esc(p.funktion)}</span>` : ""}</div></div>
      <div class="info">${sym("uhr", 24)}<div><small>Erstellt am</small>${datumZeit(b.erstellt)}</div></div>

}

    <div class="fi"><label>${t} *</label><div class="wert ${wert ? "" : "leer2"}">${esc(wert || "Bitte wählen")}</div></div>${sym("runter", 22)}</button>`;
function vForm() {
  const f = S.form, neu = !f.id;

  <main class="inhalt">
    <label class="feld" id="f-material">${sym("paket", 24)}<div class="fi"><label>Material / Bestellung *</label><textarea data-f="material" rows="1" placeholder="z. B. Schrauben 5 x 80, Spanplatte 19 mm …">${esc(f.material)}</textarea></div></label>
    <label class="feld" id="f-artikelnr">${sym("datei", 24)}<div class="fi"><label>Artikel Nr.</label><input data-f="artikelnr" value="${esc(f.artikelnr)}" placeholder="falls bekannt"></div></label>

    <div class="feld block" id="f-kommission"><div class="kopfzeile">${sym("ordner", 24)}<div class="fi"><label>Kommission *</label>
      <div class="seg breit">${[["lager", "Lager"], ["kom", "Kommissioniert"]].map(([k, t]) => `<button data-a="komart" data-w="${k}" class="${f.komArt === k ? "an" : ""}">${t}</button>`).join("")}</div>
      ${f.komArt === "kom" ? `<input data-f="kommission" id="kominput" list="komliste" value="${esc(f.kommission)}" placeholder="Name der Kommission, z. B. Küche Meier" style="margin-top:10px">
      <datalist id="komliste">${D.kom.map((k) => `<option>${esc(k.name)}</option>`).join("")}</datalist>` : ""}</div></div></div>
    <div class="feld block"><div class="kopfzeile">${sym("kamera", 24)}<div class="fi"><label>Bild anhängen</label></div></div>
      ${f.bild ? `<div class="vorschau"><img src="${f.bild}" alt=""><button data-a="bildweg">Entfernen</button></div>`

    ${wahlFeld("person", "person", "Muss bestellt werden von:", f.person)}
    ${neu ? "" : `<div class="gruppe-titel">Status</div><div class="status-wahl">${["offen", "bearbeitung", "erledigt"].map((k) => `<button data-a="fstatus" data-w="${k}" class="${k} ${f.status === k ? "an" : ""}">${STATUS[k]}</button>`).join("")}</div>`}
    <button class="knopf" data-a="senden" style="margin-top:12px">${sym(neu ? "senden" : "stift", 20)}${neu ? "Bestellung senden" : "Speichern"}</button>
    ${neu ? "" : `<button class="knopf grau" data-a="loeschen" style="margin-top:10px">${sym("muell", 20)}Bestellung löschen</button>`}
  </main>`;
}

// Auswahl Kommission oder Person
function vWahl() {
  const f = S.form, art = S.wahl;
  const liste = D.leute.map((p) => ({ n: p.name, u: [p.funktion, p.abteilung].filter(Boolean).join(" · ") }));

}

function vMenue() {
  const p = (a, icon, t) => `<button data-a="${a}" class="${S.zurueck.at(-1)?.ansicht === a ? "an" : ""}">${sym(icon, 24)}<span>${t}</span>${sym("rechts", 20)}</button>`;
  return `<div class="menue"><div class="marke-gross">${marke(44)}<button data-a="zu" aria-label="Schliessen">${sym("x", 26)}</button></div>
    <nav><!-- nur, was nicht schon unten in der Leiste steht -->
    <button data-a="einstellungen">${sym("zahnrad", 24)}<span>Einstellungen</span></button>
    <button data-a="abmelden">${sym("abmelden", 24)}<span>Abmelden</span></button></nav></div>`;
}

function vUebersicht() {
  const z = (st) => D.bestellungen.filter((b) => b.status === st).length;
  const kachel = (st, i) => `<button class="karte kachel" data-a="filterliste" data-w="${st}" style="--i:${i}">${schild(st)}<b data-zahl="${z(st)}">${z(st)}</b></button>`;
  const jeKom = D.kom.map((k, i) => {
    const n = D.bestellungen.filter((b) => b.komArt === "kom" && b.kommission === k.name && b.status !== "erledigt").length;
    const max = Math.max(1, ...D.kom.map((x) => D.bestellungen.filter((b) => b.komArt === "kom" && b.kommission === x.name && b.status !== "erledigt").length));
    return `<button class="zeile-verw" data-a="suchliste" data-w="${esc(k.name)}"><span>${esc(k.name)}<i class="balken" style="--w:${(n / max) * 100}%;--i:${i}"></i></span><small>${n} offen</small>${sym("rechts", 18)}</button>`;
  }).join("");
  const geb = D.leute.map((p) => ({ p, g: geburtstag(p.geburtstag) })).filter((x) => x.g && x.g.tage <= 30).sort((a, b) => a.g.tage - b.g.tage);
  return `${kopf()}${titel("Auswertung", false)}<main class="inhalt">
    <div class="kacheln">${kachel("offen", 0)}${kachel("bearbeitung", 1)}${kachel("erledigt", 2)}</div>
    <div class="gruppe-titel">Offen je Kommission</div><div class="liste-kasten">${jeKom || `<div class="leer">Keine Kommissionen.</div>`}</div>
    <div class="gruppe-titel">Geburtstage in den nächsten 30 Tagen</div>
    <div class="liste-kasten">${geb.map(({ p, g }) => `<button class="zeile-verw" data-a="person" data-w="${p.id}">${ava(p.name, 30)}<span>${esc(p.name)}</span><small class="${g.tage === 0 ? "heute" : ""}">${sym("kuchen", 16)} ${gebText(g)}</small></button>`).join("") || `<div class="leer">Keine Geburtstage in nächster Zeit.</div>`}</div>
  </main>`;
}

// Mitarbeitende: Karten mit Abteilung, Funktion und Geburtstag
function vMitarbeitende() {
  // Jede Stufe (Funktion) eine eigene Linie, in der Reihenfolge der Funktionen
  const fn = (p) => p.funktion || "";
  const stufen = [...D.funktionen, ...new Set(D.leute.map(fn).filter((x) => x && !D.funktionen.includes(x))), ""];
  const gruppen = stufen.map((a) => ({ a, leute: D.leute.filter((p) => fn(p) === a) })).filter((g) => g.leute.length);
  let i = 0;
  return `${kopf()}${titel("Mitarbeitende", false, istAdmin() ? `<button class="knopf klein" data-a="personneu">${sym("plus", 18)}Person</button>` : "")}<main class="inhalt">
    ${gruppen.map((g) => `<div class="stufe"><div class="gruppe-titel">${esc(g.a || "Ohne Funktion")} <i class="zahl">${g.leute.length}</i></div>
      <div class="pers-linie">${g.leute.map((p) => {
        const geb = geburtstag(p.geburtstag), anz = D.bestellungen.filter((b) => b.person === p.name && b.status !== "erledigt").length;
        return `<button class="pers" data-a="person" data-w="${p.id}" style="--i:${i++}">${ava(p.name, 44)}<div class="mitte"><b>${esc(p.name)}</b>
          <small>${esc(p.abteilung || "Keine Abteilung")}</small>
          ${p.geburtstag ? `<small class="geb ${geb?.tage === 0 ? "heute" : ""}">${sym("kuchen", 14)} ${datum(p.geburtstag)}${geb && geb.tage <= 30 ? ` · ${gebText(geb)}` : ""}</small>` : ""}</div>
          <span class="offen-zahl ${anz ? "" : "null"}">${anz}</span></button>`;
      }).join("")}</div></div>`).join("") || `<div class="leer">Noch keine Mitarbeitenden.</div>`}
  </main>`;
}

  const p = S.edit, neu = !p.id, adm = istAdmin(), selbst = !!p.id && p.id === person(D.ich)?.id, aus = adm ? "" : " disabled";
  if (!adm && !selbst) return `${kopf()}${titel(p.name)}<main class="inhalt">
    <div class="profil-karte">${ava(p.name, 84)}<h2>${esc(p.name)}</h2>
      <p>${esc([p.funktion, p.abteilung].filter(Boolean).join(" · ") || "Funktion und Abteilung noch leer")}</p>
      ${p.geburtstag ? `<p class="text-leise">${sym("kuchen", 14)} ${datum(p.geburtstag)} · ${gebText(geburtstag(p.geburtstag))}</p>` : ""}
      ${p.notiz ? `<p class="text-leise">${esc(p.notiz)}</p>` : ""}</div>
    <p class="text-leise" style="text-align:center">Ändern kann nur der Admin.</p></main>`;

    <div class="pers-kopf">${ava(p.name || "?", 76).replace(/--f:[^;]+/, "--f:" + p.farbe)}<div class="farben">${farben}</div></div>
    <label class="feld" id="e-name">${sym("person", 24)}<div class="fi"><label>Name *</label><input data-e="name" value="${esc(p.name)}" placeholder="Vor- und Nachname"${aus}></div></label>
    <label class="feld">${sym("ordner", 24)}<div class="fi"><label>Abteilung</label><select data-e="abteilung"${aus}>${optionen(D.abteilungen, p.abteilung)}</select></div></label>
    <label class="feld">${sym("marke", 24)}<div class="fi"><label>Funktion</label><input data-e="funktion" list="funktionen" value="${esc(p.funktion)}" placeholder="z. B. Schreiner EFZ"><datalist id="funktionen">${D.funktionen.map((f) => `<option>${esc(f)}</option>`).join("")}</datalist></div></label>
    <label class="feld">${sym("kuchen", 24)}<div class="fi"><label>Geburtstag</label><input type="date" data-e="geburtstag" value="${esc(p.geburtstag)}"></div></label>
    <label class="feld">${sym("datei", 24)}<div class="fi"><label>Notiz</label><textarea data-e="notiz" rows="1" placeholder="z. B. Telefon, Eintritt …">${esc(p.notiz || "")}</textarea></div></label>
    ${adm ? "" : `<p class="text-leise">Name und Abteilung ändert der Admin.</p>`}
    ${neu || !adm ? "" : `<div class="gruppe-titel">Verantwortlich für Kommissionen</div>
    <div class="liste-kasten">${D.kom.map((k) => `<button class="haken-zeile ${k.verantwortlich === p.altName ? "an" : ""}" data-a="ekom" data-w="${k.id}"><span class="kasten">${sym("haken", 14)}</span>${esc(k.name)}${k.verantwortlich && k.verantwortlich !== p.altName ? `<small>jetzt: ${esc(k.verantwortlich)}</small>` : ""}</button>`).join("") || `<div class="leer">Keine Kommissionen.</div>`}</div>`}
    <button class="knopf" data-a="esichern" style="margin-top:14px">${sym("haken", 20)}Speichern</button>
    ${neu || !adm ? "" : `<button class="knopf grau" data-a="eweg" style="margin-top:10px">${sym("muell", 20)}Person entfernen</button>`}
  </main>`;
}

function vKommissionen() {
  return `${kopf()}${titel("Kommissionen", false, `<button class="knopf klein" data-a="komneu">${sym("plus", 18)}Kommission</button>`)}<main class="inhalt">
    <div class="liste-kasten">${D.kom.map((k, i) => {

// Einstellungen: alles an einem Ort, auch Zuweisungen

      <p class="text-leise">Die Daten sind im Moment nur auf diesem Gerät gespeichert. Für gemeinsame Daten auf allen Geräten kommt später eine Datenbank dazu.</p>
      <div class="zweiknopf"><button class="knopf grau" data-a="beispiel">Beispieldaten laden</button>
      <button class="knopf grau" data-a="allesweg">${sym("muell", 20)}Bestellungen löschen</button></div></section>
    <button class="knopf grau abmelden-gross" data-a="abmelden">${sym("abmelden", 20)}Abmelden${D.ich ? " (" + esc(D.ich) + ")" : ""}</button>
  </main>`;
}

const ANSICHTEN = { start: vStart, anmelden: vAnmelden, liste: vListe, detail: vDetail, form: vForm, wahl: vWahl, menue: vMenue, uebersicht: vUebersicht,
  kommissionen: vKommissionen, kom: vKom, mitarbeitende: vMitarbeitende, person: vPerson, profil: vProfil, einstellungen: vEinstellungen };
// Welcher Reiter der Leiste gehört zu welcher Ansicht
const REITER = { liste: "liste", detail: "liste", form: "liste", wahl: "liste", uebersicht: "uebersicht", kommissionen: "kommissionen", kom: "kommissionen",
  mitarbeitende: "mitarbeitende", person: "mitarbeitende", profil: "profil", einstellungen: "einstellungen" };

function zeichne() {
  if (!["start", "anmelden"].includes(S.ansicht) && !D.ich) S.ansicht = "anmelden";
  const [f, fd] = AKZENTE[mein("akzent")] || AKZENTE.pink;
  document.documentElement.style.setProperty("--pink", f); document.documentElement.style.setProperty("--pink-dunkel", fd);
  document.body.classList.toggle("ohne-anim", !mein("animationen"));
  const mitLeiste = !["start", "anmelden", "menue"].includes(S.ansicht);
  document.body.classList.toggle("mit-leiste", mitLeiste);
  let an = REITER[S.ansicht] || "";
  if (S.ansicht === "form" && S.form?.id) an = "liste";
  app.innerHTML = `<div class="ansicht r-${S.ansicht === "menue" ? "keine" : S.richtung}">${ANSICHTEN[S.ansicht]()}</div>${mitLeiste ? leiste(an) : ""}`;
  S.richtung = "keine";
  app.querySelectorAll("textarea").forEach(hoehe);
  zahlenZaehlen();
  const ablage = document.getElementById("ablage");
  if (ablage) {
    ablage.addEventListener("dragover", (e) => { e.preventDefault(); ablage.classList.add("drueber"); });
    ablage.addEventListener("dragleave", () => ablage.classList.remove("drueber"));
    ablage.addEventListener("drop", (e) => { e.preventDefault(); ablage.classList.remove("drueber"); const d = e.dataTransfer.files[0]; if (d) bildLesen(d); });
  }
}
const hoehe = (t) => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
const animAn = () => mein("animationen") && !matchMedia("(prefers-reduced-motion: reduce)").matches;

// Zahlen in der Auswertung zählen hoch
function zahlenZaehlen() {
  if (!animAn()) return;
  app.querySelectorAll("[data-zahl]").forEach((el) => {
    const ziel = +el.dataset.zahl, t0 = performance.now();
    const schritt = (t) => { const p = Math.min(1, (t - t0) / 700); el.textContent = Math.round(ziel * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(schritt); };
    el.textContent = "0"; requestAnimationFrame(schritt);
  });
}

// Bild verkleinern, damit es im Gerätespeicher Platz hat
function bildLesen(datei) {
  if (!datei.type.startsWith("image/")) return meldung("Bitte ein Bild wählen.");
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, f = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      S.form.bild = c.toDataURL("image/jpeg", 0.8); zeichne();
    };
    img.onerror = () => meldung("Bild liess sich nicht lesen.");
    img.src = r.result;
  };
  r.readAsDataURL(datei);
}

// Name einer Person ändern: auch in Bestellungen und Kommissionen nachziehen
function nameUmbenennen(alt, neu) {
  if (!alt || alt === neu) return;
  D.bestellungen.forEach((b) => { if (b.person === alt) b.person = neu; });
  D.kom.forEach((k) => { if (k.verantwortlich === alt) k.verantwortlich = neu; });
  if (D.ich === alt) D.ich = neu;
}

// ---------- Ereignisse ----------
app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "suche") { S.suche = t.value; const k = document.getElementById("karten"); k.classList.add("still"); k.innerHTML = karten(sortiert()); return; }
  if (t.dataset.f) { S.form[t.dataset.f] = t.value; t.closest(".feld").classList.remove("fehler"); if (t.tagName === "TEXTAREA") hoehe(t); }
  if (t.dataset.e) { S.edit[t.dataset.e] = t.value; t.closest(".feld")?.classList.remove("fehler"); if (t.tagName === "TEXTAREA") hoehe(t);
    if (t.dataset.e === "name" && S.ansicht === "person") { const a = app.querySelector(".pers-kopf .ava"); if (a) a.textContent = initialen(t.value || "?"); } }
  if (t.dataset.s && istAdmin()) { D.einst[t.dataset.s] = t.value; speichern(); if (t.tagName === "TEXTAREA") hoehe(t); }
});
app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "datei" && t.files[0]) bildLesen(t.files[0]);
  if (t.id === "plandatei" && t.files.length) planeDazu([...t.files]);
  if (t.id === "kominput" && D.einst.verantwortlichVorschlagen) {
    const k = D.kom.find((x) => x.name === t.value.trim());
    if (k?.verantwortlich && (!S.form.person || S.form.person === D.ich)) { S.form.person = k.verantwortlich; zeichne(); }
  }
  if (t.id === "adminwahl" && istAdmin()) {
    const p = D.leute.find((x) => x.id === t.value);
    if (p && confirm(`${p.name} wird Admin. Du siehst danach die Einstellungen nicht mehr. Weiter?`)) { D.admin = p.id; speichern(); reiter("liste"); meldung("Admin ist jetzt " + p.name); }
    else t.value = D.admin;
  }
  if ((t.dataset.zp || t.dataset.zk) && !nurAdmin()) return;
  if (t.dataset.zp) { const p = D.leute.find((x) => x.id === t.dataset.zp); p[t.dataset.k] = t.value; speichern(); blitz(t); }
  if (t.dataset.zk) { const k = D.kom.find((x) => x.id === t.dataset.zk); k[t.dataset.k] = t.value; speichern(); blitz(t); }
});
const blitz = (el) => { el.classList.remove("gespeichert"); void el.offsetWidth; el.classList.add("gespeichert"); };
app.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.dataset.neu) app.querySelector(`[data-a="ldazu"][data-l="${e.target.dataset.neu}"]`).click();
});

app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, w = el.dataset.w;
  if (a === "neuladen") { location.reload(); return; }
  if ((a === "esichern" || a === "efarbe") && S.edit?.id !== person(D.ich)?.id && !nurAdmin()) return;
  if (a === "schalter" && w !== "animationen" && !nurAdmin()) return;
  if (["personneu", "eweg", "ekom", "ldazu", "lweg", "beispiel", "allesweg"].includes(a) && !nurAdmin()) return;
  switch (a) {
    case "anmelden": S.ansicht = "anmelden"; S.richtung = "vor"; zeichne(); break;
    case "wer": {
      const weiter = () => { D.ich = w; speichern(); S.zurueck = []; S.ansicht = "liste"; S.richtung = "vor"; zeichne(); meldung("Hallo " + w.split(" ")[0] + " 👋"); };
      if (app.querySelector(".an-raster.saegt")) break;
      el.classList.add("gewaehlt");
      if (animAn()) saegen(el, weiter); else weiter();
      break;
    }
    case "liste": case "uebersicht": case "kommissionen": case "mitarbeitende": case "einstellungen": case "profil": reiter(a); break;
    case "menue": gehe("menue"); break;
    case "zu": case "zurueck": zurueck(); break;
    case "filter": S.filter = w; app.querySelectorAll('[data-a="filter"]').forEach((b) => b.classList.toggle("an", b.dataset.w === w)); document.getElementById("karten").classList.remove("still"); document.getElementById("karten").innerHTML = karten(sortiert()); break;
    case "filterliste": S.filter = w; S.suche = ""; reiter("liste"); break;
    case "suchliste": S.filter = "alle"; S.suche = w; reiter("liste"); break;
    case "detail": gehe("detail", { id: el.dataset.id }); break;
    case "neu": formNeu(); if (S.ansicht === "menue") { S.zurueck = []; S.ansicht = "form"; S.richtung = "reiter"; zeichne(); } else reiter("form"); break;
    case "bearbeiten": formNeu(D.bestellungen.find((b) => b.id === S.id)); gehe("form"); break;
    case "status": {
      const b = D.bestellungen.find((x) => x.id === S.id); b.status = w; speichern();
      app.querySelectorAll('[data-a="status"]').forEach((x) => x.classList.toggle("an", x.dataset.w === w));
      const s = document.getElementById("schild"); s.innerHTML = schild(w); s.firstChild.classList.add("pop");
      meldung("Status: " + STATUS[w]); break;
    }
    case "einheit": S.form.einheit = w; app.querySelectorAll('[data-a="einheit"]').forEach((x) => x.classList.toggle("an", x.dataset.w === w)); break;
    case "komart": S.form.komArt = w; zeichne(); if (w === "kom") document.getElementById("kominput")?.focus(); break;
    case "planneu": document.getElementById("plandatei").click(); break;
    case "planzeig": planZeigen(w); break;
    case "planweg": planWeg(w); break;
    case "fstatus": S.form.status = w; app.querySelectorAll('[data-a="fstatus"]').forEach((x) => x.classList.toggle("an", x.dataset.w === w)); break;
    case "bildwahl": document.getElementById("datei").click(); break;
    case "bildweg": S.form.bild = ""; zeichne(); break;
    case "wahl": S.wahl = w; if (S.ansicht === "wahl") zeichne(); else gehe("wahl"); break;
    case "waehle": {
      S.form.person = w;
      el.classList.add("an"); setTimeout(zurueck, animAn() ? 180 : 0); break;
    }
    case "senden": senden(); break;
    case "loeschen":
      if (!confirm("Bestellung wirklich löschen?")) break;
      D.bestellungen = D.bestellungen.filter((b) => b.id !== S.form.id); speichern();
      reiter("liste"); meldung("Bestellung gelöscht"); break;
    case "abmelden": D.ich = ""; speichern(); S.zurueck = []; S.ansicht = "anmelden"; S.richtung = "zurueck"; zeichne(); break;

    // Mitarbeitende
    case "personneu": S.edit = { id: null, name: "", abteilung: "", funktion: "", geburtstag: "", notiz: "", farbe: FARBEN[D.leute.length % FARBEN.length] }; gehe("person"); break;
    case "person": { const p = D.leute.find((x) => x.id === w); S.edit = { ...p, altName: p.name, komWahl: null }; gehe("person"); break; }
    case "efarbe": S.edit.farbe = w; app.querySelectorAll(".farbe").forEach((x) => x.classList.toggle("an", x.dataset.w === w)); app.querySelector(".pers-kopf .ava").style.setProperty("--f", w); break;
    case "ekom": el.classList.toggle("an"); break;
    case "esichern": {
      const p = S.edit, alt = D.leute.find((x) => x.id === p.id), adm = istAdmin(); if (!adm) { p.name = alt.name; p.abteilung = alt.abteilung; } const n = p.name.trim();
      if (!n) { document.getElementById("e-name").classList.add("fehler"); meldung("Bitte einen Namen eingeben."); break; }
      if (D.leute.some((x) => x.name === n && x.id !== p.id)) { meldung("Diesen Namen gibt es schon."); break; }
      const daten = { id: p.id || neueId(), name: n, abteilung: p.abteilung, funktion: p.funktion.trim(), geburtstag: p.geburtstag, notiz: p.notiz || "", farbe: p.farbe };
      if (p.id) {
        if (adm) { nameUmbenennen(p.altName, n);
        app.querySelectorAll('[data-a="ekom"]').forEach((b) => { const k = D.kom.find((x) => x.id === b.dataset.w);
          if (b.classList.contains("an")) k.verantwortlich = n; else if (k.verantwortlich === n) k.verantwortlich = ""; }); }
        D.leute[D.leute.findIndex((x) => x.id === p.id)] = daten;
      } else D.leute.push(daten);
      if (daten.funktion && !D.funktionen.includes(daten.funktion)) D.funktionen.push(daten.funktion);
      speichern(); zurueck(); meldung("Gespeichert"); break;
    }
    case "eweg":
      if (!confirm(`„${S.edit.altName}“ entfernen? Bestehende Bestellungen bleiben.`)) break;
      D.leute = D.leute.filter((x) => x.id !== S.edit.id); speichern(); zurueck(); break;

    // Kommissionen
    case "komneu": S.edit = { id: null, name: "", abteilung: "", verantwortlich: "", plaene: [] }; gehe("kom"); break;
    case "kom": S.edit = { ...D.kom.find((x) => x.id === w) }; S.edit.plaene = [...(S.edit.plaene || [])]; S.edit.altName = S.edit.name; gehe("kom"); break;
    case "ksichern": {
      const k = S.edit, n = k.name.trim();
      if (!n) { document.getElementById("e-name").classList.add("fehler"); meldung("Bitte einen Namen eingeben."); break; }
      if (D.kom.some((x) => x.name === n && x.id !== k.id)) { meldung("Diese Kommission gibt es schon."); break; }
      const daten = { id: k.id || neueId(), name: n, abteilung: k.abteilung, verantwortlich: k.verantwortlich, plaene: k.plaene || [] };
      if (k.id) { D.bestellungen.forEach((b) => { if (b.kommission === k.altName) b.kommission = n; }); D.kom[D.kom.findIndex((x) => x.id === k.id)] = daten; }
      else D.kom.push(daten);
      speichern(); zurueck(); meldung("Gespeichert"); break;
    }
    case "kweg":
      if (!confirm(`„${S.edit.altName}“ entfernen? Bestehende Bestellungen bleiben.`)) break;
      (S.edit.plaene || []).forEach((x) => planDel(x.id).catch(() => {}));
      D.kom = D.kom.filter((x) => x.id !== S.edit.id); speichern(); zurueck(); break;

    // Einstellungen
    case "schalter": { if (w === "animationen") { D.einst.je ??= {}; (D.einst.je[meinId()] ??= {})[w] = !mein(w); } else D.einst[w] = !D.einst[w]; speichern(); el.querySelector(".schalter").classList.toggle("an", !!(w === "animationen" ? mein(w) : D.einst[w])); document.body.classList.toggle("ohne-anim", !mein("animationen")); break; }
    case "akzent": D.einst.je ??= {}; (D.einst.je[meinId()] ??= {}).akzent = w; speichern(); zeichne(); break;
    case "ldazu": {
      const inp = document.getElementById("neu-" + el.dataset.l), n = inp.value.trim(); if (!n) break;
      const l = D[el.dataset.l]; if (l.includes(n)) { meldung("Gibt es schon"); break; }
      l.push(n); speichern(); zeichne(); document.getElementById("neu-" + el.dataset.l).focus(); break;
    }
    case "lweg": { const l = D[el.dataset.l]; l.splice(+w, 1); speichern(); zeichne(); break; }
    case "gross": { const g = document.createElement("div"); g.className = "gross-bild"; g.innerHTML = `<img src="${el.src}" alt="">`; g.onclick = () => g.remove(); document.body.append(g); break; }
    case "beispiel": if (confirm("Alle Daten durch die Beispieldaten ersetzen?")) { const ich = D.ich; D = vorgabe(); D.ich = person(ich) ? ich : ""; speichern(); zeichne(); meldung("Beispieldaten geladen"); } break;
    case "allesweg": if (confirm("Alle Bestellungen löschen?")) { D.bestellungen = []; speichern(); meldung("Alle Bestellungen gelöscht"); } break;
  }
});

// ---------- Pläne für die Montage ----------
function planListe(k, bearbeiten) {
  if (!k) return "";
  const pl = k.plaene || [];
  if (!pl.length && !bearbeiten) return "";
  return `<div class="gruppe-titel">Pläne für die Montage <i class="zahl">${pl.length}</i></div>
    <div class="liste-kasten plaene">${pl.map((x) => `<div class="plan-zeile"><button class="plan-oeffnen" data-a="planzeig" data-w="${x.id}">${sym(x.typ === "application/pdf" ? "datei" : "kamera", 22)}<span><b>${esc(x.name)}</b><small>${datumZeit(x.datum)}</small></span></button>${bearbeiten ? `<button class="plan-weg" data-a="planweg" data-w="${x.id}" aria-label="Plan entfernen">${sym("muell", 18)}</button>` : ""}</div>`).join("")
      || `<div class="leer">Noch keine Pläne.</div>`}</div>
    ${bearbeiten ? `<button class="knopf grau" data-a="planneu" style="margin-top:8px">${sym("plus", 18)}Plan anhängen (PDF oder Bild)</button><input type="file" id="plandatei" accept="application/pdf,image/*" multiple hidden>
    <p class="text-leise">Die Pläne bleiben vorerst auf diesem Gerät. Mit eigenem Server sehen sie später alle.</p>` : ""}`;
}
// Gehört der Plan zur Kommission, die gerade offen ist, oder zu einer gespeicherten?
const planOrt = (id) => (S.ansicht === "kom" && S.edit?.plaene?.some((x) => x.id === id)) ? S.edit : D.kom.find((k) => (k.plaene || []).some((x) => x.id === id));
async function planeDazu(dateien) {
  const k = S.edit; let n = 0;
  for (const d of dateien) {
    if (!(d.type === "application/pdf" || d.type.startsWith("image/"))) { meldung("Nur PDF oder Bilder."); continue; }
    const x = { id: neueId(), name: d.name, typ: d.type, datum: jetzt() };
    try { await planPut(x.id, d); } catch { meldung("Plan liess sich nicht speichern."); continue; }
    k.plaene.push(x); n++;
  }
  // Bestehende Kommission: gleich mitspeichern, damit der Plan nicht verloren geht
  const gespeichert = k.id && D.kom.find((x) => x.id === k.id);
  if (gespeichert) { gespeichert.plaene = [...k.plaene]; speichern(); }
  zeichne(); if (n) meldung(n === 1 ? "Plan angehängt" : n + " Pläne angehängt");
}
async function planZeigen(id) {
  const k = planOrt(id), x = k?.plaene.find((p) => p.id === id); if (!x) return;
  const fenster = x.typ === "application/pdf" ? window.open("", "_blank") : null; // gleich öffnen, sonst sperrt Safari
  let blob; try { blob = await planGet(id); } catch {}
  if (!blob) { fenster?.close(); return meldung("Plan ist nur auf dem Gerät, auf dem er angehängt wurde."); }
  const url = URL.createObjectURL(blob);
  if (fenster) { fenster.location = url; return; }
  const g = document.createElement("div"); g.className = "gross-bild"; g.innerHTML = `<img src="${url}" alt="">`; g.onclick = () => { g.remove(); URL.revokeObjectURL(url); }; document.body.append(g);
}
async function planWeg(id) {
  const k = planOrt(id); if (!k || !confirm("Plan entfernen?")) return;
  k.plaene = k.plaene.filter((x) => x.id !== id);
  const gespeichert = k.id && D.kom.find((x) => x.id === k.id);
  if (gespeichert && gespeichert !== k) gespeichert.plaene = [...k.plaene];
  speichern(); planDel(id).catch(() => {}); zeichne();
}

function senden() {
  const f = S.form; let fehlt = [];
  for (const k of ["material", "menge", "person"]) if (!String(f[k] || "").trim()) fehlt.push(k);
  if (f.komArt === "kom" && !String(f.kommission || "").trim()) fehlt.push("kommission");
  if (f.komArt !== "kom") f.kommission = ""; else f.kommission = f.kommission.trim();
  fehlt.forEach((k) => { const el = document.getElementById("f-" + k); el?.classList.remove("fehler"); void el?.offsetWidth; el?.classList.add("fehler"); });
  if (fehlt.length) return meldung("Bitte alle Felder mit * ausfüllen.");
  // Neue Kommission gleich in die Liste aufnehmen
  if (f.komArt === "kom" && !D.kom.some((k) => k.name === f.kommission)) D.kom.push({ id: neueId(), name: f.kommission, abteilung: "", verantwortlich: "", plaene: [] });
  if (f.id) {
    const i = D.bestellungen.findIndex((b) => b.id === f.id); D.bestellungen[i] = { ...D.bestellungen[i], ...f };
    speichern(); S.zurueck.pop(); S.ansicht = "detail"; S.id = f.id; S.richtung = "zurueck"; zeichne(); meldung("Gespeichert");
  } else {
    const b = { ...f, id: neueId(), status: "offen", erstellt: jetzt() };
    D.bestellungen.push(b); speichern(); S.filter = "alle"; S.suche = ""; reiter("liste"); meldung("Bestellung gesendet ✓");
    app.querySelector(`[data-id="${b.id}"]`)?.classList.add("neu-da");
  }
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.zurueck.length) zurueck(); });
matchMedia("(min-width: 900px)").addEventListener("change", () => { if (S.ansicht === "menue") zurueck(); });
zeichne();
</script></body></html>
