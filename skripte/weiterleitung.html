<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hofer Tool ist umgezogen</title>
<script>
  // =============================================================
  //  Diese Seite ersetzt im ALTEN GitHub-Konto die index.html.
  //  Wer die alte Adresse öffnet — Lesezeichen, Pads, Zurbrügg —,
  //  landet sofort bei der neuen.
  // =============================================================
  var NEU = "https://hofertool.github.io/hofertool/";

  var ziel = NEU;
  try {
    // Geräte, die als extern markiert waren (Zurbrügg), bleiben es
    if (localStorage.getItem("hofer.geraet") === "extern") ziel = NEU + "#/extern";
  } catch (e) {}
  if (/^#\/?(extern|intern)\b/i.test(location.hash)) ziel = NEU + location.hash;

  // Den alten Zwischenspeicher der App abmelden, damit er nicht mehr
  // die alte Fassung ausliefert
  try {
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations().then(function (r) {
        r.forEach(function (x) { x.unregister(); });
      });
    }
    if (window.caches) caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); });
  } catch (e) {}

  location.replace(ziel);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f3f5f8; color: #1f2937; }
  .karte { background: #fff; padding: 32px 36px; border-radius: 16px; text-align: center;
           box-shadow: 0 10px 30px rgba(0, 0, 0, .08); max-width: 420px; }
  h1 { font-size: 1.3rem; margin: 0 0 10px; color: #003a85; }
  a { display: inline-block; margin-top: 14px; padding: 12px 22px; border-radius: 10px;
      background: #003a85; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="karte">
    <h1>Das Hofer Tool ist umgezogen</h1>
    <p>Du wirst gleich weitergeleitet.<br>Bitte das neue Lesezeichen speichern.</p>
    <a id="weiter" href="#">Zur neuen Adresse</a>
  </div>
  <script>document.getElementById("weiter").href = ziel;</script>
</body>
</html>
