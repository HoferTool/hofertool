# Einmalig: Aufbau der Excel-Einrichtblätter je Typ zusammenfassen (nur
# Platz-Nummern und Beschriftungen). Wird gleich wieder entfernt. (3)
name: Excel-Aufbau
on:
  push:
    branches: [claude/project-thread-au2n7k]
    paths: [".github/workflows/excel-aufbau-tmp.yml"]
jobs:
  lesen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openpyxl xlrd
      - run: |
          mkdir x
          cut -d' ' -f2 werkzeuge/excel-liste-tmp.txt | xargs -P 12 -I{} curl -sS -o x/{} https://lzhqwbxfwqamauntehof.supabase.co/storage/v1/object/public/zeichnungen/dok/{}
          python werkzeuge/excel-sammeln-tmp.py werkzeuge/excel-liste-tmp.txt 2>&1 | grep -v "UserWarning\|warn(msg)"
