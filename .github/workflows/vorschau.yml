# Stellt die Website auf GitHub Pages zusammen, während die App auf
# React umgebaut wird:
#   .../hofertool/           die Live-App, genau so wie sie auf main liegt
#   .../hofertool/vorschau/  die neue Fassung aus dem Umbau-Zweig, gebaut
#
# Läuft bei jedem Push auf main und jedes Mal, wenn der Prüfstand auf
# dem Umbau-Zweig grün geworden ist. Voraussetzung: In den Einstellungen
# des Repositorys unter Pages steht bei „Source" der Eintrag
# „GitHub Actions". Beim Umschalten auf React wird diese Datei durch
# ausliefern.yml ersetzt.
name: Seite mit Vorschau

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Prüfen"]
    types: [completed]
    branches: [claude/react-umbau-4p3juj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Auslieferungen gleichzeitig; die neuere gewinnt
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    # Nach dem Prüfstand nur, wenn er grün war
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Live-App holen (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: live

      # Geht beim Umbau etwas schief, kommt die Live-App trotzdem raus,
      # nur eben ohne Vorschau
      - name: Umbau-Zweig holen
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'claude/react-umbau-4p3juj' }}
          path: umbau

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: umbau/package-lock.json

      - name: Neue Fassung bauen
        continue-on-error: true
        working-directory: umbau
        run: |
          npm ci
          npm run build

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          # Alles von main wie bisher, ohne die versteckten Ordner
          rsync -a --exclude='.*' live/ _site/
          if [ -f umbau/dist/index.html ]; then
            mkdir -p _site/vorschau
            cp -r umbau/dist/. _site/vorschau/
          else
            echo "::warning::Neue Fassung nicht gebaut, Seite ohne Vorschau"
          fi
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  ausliefern:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
