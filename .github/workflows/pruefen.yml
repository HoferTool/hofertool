# Baut die App und lässt den ganzen Prüfstand darüber laufen, bei
# jedem Pull Request, jedem Push auf einen Arbeitszweig und jede Nacht
# um Mitternacht auf main (Wunsch Patrick 3. November 2026: „jede Nacht
# allgemein testen, damit so etwas nicht nochmals passiert“).
name: Prüfen

on:
  pull_request:
  push:
    branches-ignore: [main]
  schedule:
    # Mo–Fr 00:00 Schweizer Winterzeit (01:00 im Sommer); sonntags ist
    # das Infoboard den ganzen Tag im Nachtmodus
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

jobs:
  pruefstand:
    runs-on: ubuntu-latest
    # Der ganze Prüfstand braucht inzwischen über 40 Minuten; 3 Stunden,
    # damit die Nacht nicht wegen der Laufzeit rot wird (Wunsch Patrick
    # 5. November 2026: „einfach auf 3h stellen“).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - name: Prüfstand
        working-directory: pruefstand
        run: python alle_tests.py | tee ergebnis.txt && grep -q "^\([0-9]*\) von \1 Prüfungen ohne Fehler" ergebnis.txt
